name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package with capture and test extras
        run: python -m pip install '.[capture,test]'
      - name: Run offline replay, evaluation and export tests
        run: python -m unittest discover -s tests -v
      - name: Validate observation contract
        run: python -m unittest discover -s tests -p schema_contract.py -v
      - name: Test capture with local fixture responses
        run: python -m unittest discover -s tests -p capture_flow.py -v
      - name: Run the installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          tao --version
          fixture_dir="$GITHUB_WORKSPACE/tests/fixtures"
          tao replay "$fixture_dir/home.snapshot.json" > observation.json
          cmp observation.json "$fixture_dir/home.observation.json"
          tao evaluate observation.json --surface consumer_homepage --rubric-version 0.1.0 > assessment.json
          tao export --manifest "$fixture_dir/home.manifest.json" --rubric-version 0.1.0 observation.json > dataset.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          assessment = json.loads(Path("assessment.json").read_bytes())
          rows = [json.loads(line) for line in Path("dataset.jsonl").read_bytes().splitlines()]
          assert rows[0]["assessment"] == assessment
          assert assessment["result"] == "met"
          assert rows[-1]["valid_observation_count"] == 1
          PY
