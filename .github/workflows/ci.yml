name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and schema test dependency
        run: python -m pip install '.[test]'
      - name: Run offline replay tests
        run: python -m unittest discover -s tests -v
      - name: Validate observation contract
        run: python -m unittest discover -s tests -p schema_contract.py -v
      - name: Replay with installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          tao --version
          tao replay "$GITHUB_WORKSPACE/tests/fixtures/home.snapshot.json" |
            cmp - "$GITHUB_WORKSPACE/tests/fixtures/home.observation.json"
