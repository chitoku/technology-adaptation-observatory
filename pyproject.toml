[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "technology-adaptation-observatory"
version = "0.1.0"
description = "Reproducible observations of public technology choices"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
capture = ["Protego>=0.5,<0.8"]
test = ["jsonschema[format-nongpl]>=4.18,<5"]

[project.scripts]
tao = "tao.__main__:main"

[tool.setuptools]
packages = ["tao"]
